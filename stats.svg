<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130" role="img" aria-label="GitHub stats" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:'Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace}
.panel{fill:#0d1117;stroke:#FF8FAB;stroke-opacity:.35}
.title{fill:#FF8FAB;font-size:15px;font-weight:600}
.cat{fill:#FF8FAB;font-size:12.5px;font-weight:600}
.muted{fill:#8b949e;font-size:10.5px}
.lbl{fill:#8b949e;font-size:10.5px;text-anchor:middle}
.tile{fill:#161b22;stroke:#30363d}
.tile.live{stroke:#FF8FAB;animation:glow 2.4s ease-in-out infinite alternate}
.dot{fill:#FF8FAB;animation:pulse 1.6s ease-in-out infinite}
.cursor{fill:#FF8FAB;animation:blink 1s steps(1) infinite}
.enter{opacity:0;animation:enter .6s ease-out forwards}
.float{animation:float 3.2s ease-in-out infinite}
.white{filter:brightness(0) invert(1)}
.big{fill:#FF8FAB;font-size:30px;font-weight:700}
.card{fill:#161b22;stroke:#FF8FAB;stroke-opacity:.4;animation:glow 3s ease-in-out infinite alternate}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes glow{from{stroke-opacity:.3}to{stroke-opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style><rect class="panel" x="0.5" y="0.5" width="799" height="129" rx="14"/><g class="enter" style="animation-delay:0.00s"><rect class="card" x="20.0" y="22" width="178.0" height="86" rx="12" style="animation-delay:0.0s"/><text class="big" x="109.0" y="68" text-anchor="middle">2</text><text class="lbl" x="109.0" y="92">merged PRs (open source)</text></g><g class="enter" style="animation-delay:0.15s"><rect class="card" x="214.0" y="22" width="178.0" height="86" rx="12" style="animation-delay:0.4s"/><text class="big" x="303.0" y="68" text-anchor="middle">1</text><text class="lbl" x="303.0" y="92">open PRs</text></g><g class="enter" style="animation-delay:0.30s"><rect class="card" x="408.0" y="22" width="178.0" height="86" rx="12" style="animation-delay:0.8s"/><text class="big" x="497.0" y="68" text-anchor="middle">2</text><text class="lbl" x="497.0" y="92">public repos</text></g><g class="enter" style="animation-delay:0.45s"><rect class="card" x="602.0" y="22" width="178.0" height="86" rx="12" style="animation-delay:1.2s"/><text class="big" x="691.0" y="68" text-anchor="middle">4</text><text class="lbl" x="691.0" y="92">stars earned</text></g></svg>